global:
  scrape_interval: 1m

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      # node-exporter 使用宿主机网络，不再注册到 Compose 网络的服务 DNS。
      - targets: ['host.docker.internal:3001']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'sakura_share'
    scrape_interval: 15s
    scheme: https
    static_configs:
      - targets: ['sakura-share.one']
